<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    /* Cool gradient background */
    background: #6667AB
  }

  .fullscreen-text {
    /* Use viewport width (vw) to size text relative to browser width */
    font-size: 90vw;
    font-weight: bold;
    height: 100%;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
</style>
</head>
<body>
<div class="fullscreen-text">
  RJ
</div>
</body>
</html>
